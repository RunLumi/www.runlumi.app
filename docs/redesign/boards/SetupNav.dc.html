<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Menu cài đặt tổ chức</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lumi.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.sn-sec{padding:10px 4px 6px}
.sn-sec + .sn-sec{border-top:1px solid #E7EAF0;margin-top:10px;padding-top:14px}
.sn-title{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.sn-title .t-ic{width:28px;height:28px;border-radius:7px;background:#102A43;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sn-title b{font:650 14px/1.2 Geist,system-ui,sans-serif;color:#102A43;display:block}
.sn-title small{font:400 12px/1.3 Geist,system-ui,sans-serif;color:#5E6677}
.sn-grp{margin:6px 0 10px}
.sn-sub{display:flex;align-items:center;gap:8px;font:600 10.5px/1.2 Geist,system-ui,sans-serif;color:#8A93A3;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 6px;cursor:default;user-select:none}
.sn-sub::after{content:"";flex:1;height:1px;background:#E7EAF0}
.sn-items{display:flex;flex-direction:column;gap:2px}
.side-nav .sn-items a{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:8px 10px;border-radius:6px;font:500 14px/1.2 Geist,system-ui,sans-serif;color:#172033;border-left:3px solid transparent}
.side-nav .sn-items a svg{width:16px;height:16px;color:#5E6677;flex:none}
.side-nav .sn-items a:hover{background:#F2F4F7}
.side-nav .sn-items a.on{background:#E4F3FC;color:#004F80;font-weight:600;border-left-color:#006093}
.side-nav .sn-items a.on svg{color:#006093}
</style>
</helmet>
<div class="root" style="width: 100%; background: transparent">
<nav class="panel side-nav" aria-label="Cài đặt tổ chức" style="padding: 8px">
<label class="search" style="margin: 4px 4px 4px; height: 34px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="sr">Tìm trong cài đặt tổ chức</span><input type="search" placeholder="Tìm trong cài đặt tổ chức"></label>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div class="sn-sec" role="group" aria-label="{{s.title}}">
<div class="sn-title"><span class="t-ic" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="{{s.icon}}"></path></svg></span><span><b>{{s.title}}</b><small>{{s.note}}</small></span></div>
<sc-for list="{{s.groups}}" as="g" hint-placeholder-count="2">
<div class="sn-grp" role="group" aria-label="{{g.aria}}">
<sc-if value="{{g.hasLabel}}" hint-placeholder-val="{{true}}"><div class="sn-sub" aria-hidden="true">{{g.label}}</div></sc-if>
<div class="sn-items"><sc-for list="{{g.items}}" as="i" hint-placeholder-count="3"><a class="{{i.cls}}" href="{{i.href}}" aria-current="{{i.cur}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.label}}</a></sc-for></div>
</div>
</sc-for>
</div>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Thành viên và nhóm"},"$preview":{"width":260,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? '';
    const P = {
      users: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M22 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',
      key: 'M15 7a4 4 0 1 1-3.5 6L4 20.5V17h3v-3h3l1.5-1.5A4 4 0 0 1 15 7',
      shield: 'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      bell: 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',
      bot: 'M12 8V4M8 8h8a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4M9 13h.01M15 13h.01',
      hook: 'M10 14a3 3 0 1 1-2.6-3M14 10a3 3 0 1 1 2.6 3M12 7l-3 6h6l-3 6',
      mail: 'M3 6h18v12H3zM3 7l9 6 9-6',
      grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
      card: 'M3 6h18v12H3zM3 10h18M7 15h4',
      crm: 'M3 4h18l-7 8v6l-4 2v-8z',
      pulse: 'M3 12h4l3-8 4 16 3-8h4',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
      org: 'M4 21V5l8-3 8 3v16M9 21v-4h6v4M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01',
      apps: 'M12 2l9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5'
    };
    const I = (label, href, icon) => ({ label: label, href: href, icon: P[icon], cls: label === active ? 'on' : '', cur: label === active ? 'page' : 'false' });
    const G = (label, items) => ({ label: label, aria: label || 'Mục', hasLabel: !!label, items: items });
    return {
      sections: [
        { title: 'Tổ chức Mộc Gia', note: 'Áp dụng cho mọi thành viên', icon: P.org, groups: [
          G('Thành viên và quyền', [I('Thành viên và nhóm', 'MembersTeams.dc.html', 'users'), I('Vai trò & Phân quyền', 'Roles.dc.html', 'key')]),
          G('Bảo mật và tuân thủ', [I('Chính sách bảo mật', 'OrgSecurity.dc.html', 'shield'), I('Nhật ký kiểm toán', 'AuditLog.dc.html', 'list')]),
          G('Thông báo và tích hợp', [I('Quy tắc thông báo', 'NotificationRules.dc.html', 'bell'), I('AI agent (MCP)', 'OrgAgents.dc.html', 'bot'), I('Webhook', 'Webhooks.dc.html', 'hook'), I('Email & Tên miền', '#', 'mail')]),
          G('Ứng dụng và nguồn dữ liệu', [I('Ứng dụng', '#', 'grid'), I('Nguồn kết nối', '#', 'hook'), I('Chương trình giới thiệu', '#', 'users')])
        ] },
        { title: 'Cài đặt ứng dụng', note: 'Cấu hình riêng từng ứng dụng', icon: P.apps, groups: [G('', [I('Cấu hình CRM', 'Settings.dc.html', 'crm'), I('Cấu hình báo cáo hằng ngày', '#', 'pulse'), I('Chấm công', '#', 'clock')])] }
      ]
    };
  }
}
</script>
</body>
</html>
