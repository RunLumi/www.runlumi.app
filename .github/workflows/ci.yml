name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
          cache: npm
      # npm ci installs exactly what package-lock.json pins; it never
      # re-resolves version ranges, so npm 11's release-age filter
      # (see README "Dependency install policy") cannot change the
      # dependency tree or fail on freshly published versions.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate:local
      - run: npm run build
